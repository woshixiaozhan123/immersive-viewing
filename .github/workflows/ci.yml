name: CI & Release Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate syntax & manifest (without models)
        run: npm run check

      - name: Download official offline MediaPipe assets
        run: npm run setup

      - name: Build clean MV3 release zip
        run: npm run build

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: immersive-viewing-extension
          path: dist/*.zip
          if-no-files-found: error
