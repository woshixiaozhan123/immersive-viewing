<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地媒体库 · 实时美颜</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ff4d8d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="lib-wrap">
  <div class="lib-head">
    <div>
      <h1 class="lib-title">本地媒体库<span class="dot"></span></h1>
      <p class="lib-sub" id="sub">正在读取缓存…</p>
    </div>
    <div class="lib-actions">
      <button class="btn ghost" id="btn-sweep" title="按规则立刻清理一次">立即清理</button>
      <button class="btn ghost" id="btn-refresh">刷新</button>
    </div>
  </div>
  <div class="sweep-bar" id="sweep-bar">正在读取清理规则…</div>
  <div class="grid" id="grid"></div>
</div>

<script>
(() => {
  const grid = document.getElementById("grid");
  const sub = document.getElementById("sub");
  const btnRefresh = document.getElementById("btn-refresh");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function fmtBytes(n) {
    if (!n) return "0 B";
    const u = ["B", "KB", "MB", "GB", "TB"];
    let i = 0;
    let v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i += 1; }
    return `${v >= 100 ? Math.round(v) : v.toFixed(1)} ${u[i]}`;
  }

  function fmtDur(sec) {
    const s = Math.max(0, Math.round(Number(sec) || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`
      : `${m}:${String(ss).padStart(2, "0")}`;
  }

  function cardHtml(it) {
    const pct = it.totalSegments ? Math.round((it.cachedSegments / it.totalSegments) * 100) : 0;
    const res = (it.resolution || "").replace("x", "×");
    const bits = [
      it.durationSec ? `时长 ${fmtDur(it.durationSec)}` : "",
      res,
      fmtBytes(it.cachedBytes),
    ].filter(Boolean);
    return `
      <article class="card" data-key="${esc(it.key)}">
        <div class="thumb">
          <div class="fallback">${esc((it.site || "?").slice(0, 2).toUpperCase())}</div>
          <img loading="lazy" alt="" src="/thumb/${encodeURIComponent(it.key)}"
               onerror="this.style.display='none'">
          <div class="site">${esc(it.site)}</div>
          <div class="dur">${fmtDur(it.cachedDurationSec)}${it.durationSec > it.cachedDurationSec + 1 ? " / " + fmtDur(it.durationSec) : ""}</div>
        </div>
        <div class="card-body">
          <div class="card-name" title="${esc(it.title)}">${esc(it.title)}</div>
          <div class="card-meta">${bits.map((b) => `<span>${esc(b)}</span>`).join("")}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="pct">已缓存 ${it.cachedSegments} / ${it.totalSegments} 片 · ${pct}%</div>
          <div class="card-foot">
            <button class="btn primary" data-act="play" ${it.playable ? "" : "disabled"}>播放</button>
            <button class="btn icon danger" data-act="del" title="删除本地缓存">删除</button>
          </div>
        </div>
      </article>`;
  }

  async function load() {
    sub.textContent = "正在读取缓存…";
    let data;
    try {
      const r = await fetch("/api/library", { cache: "no-store" });
      data = await r.json();
    } catch (e) {
      sub.textContent = "读取失败：本地服务没有响应。";
      return;
    }
    const items = data.items || [];
    if (!items.length) {
      grid.innerHTML = `
        <div class="empty">
          <strong>还没有缓存任何视频</strong>
          在目标站点把视频播放几秒，分片就会自动落到本地磁盘。<br>
          缓存目录：<code>${esc(data.cacheDir || "")}</code>
        </div>`;
      sub.innerHTML = `共 0 个视频 · 目录 <code>${esc(data.cacheDir || "")}</code>`;
      return;
    }
    grid.innerHTML = items.map(cardHtml).join("");
    sub.innerHTML = `共 ${items.length} 个视频 · 占用 ${fmtBytes(data.totalBytes)} · 目录 <code>${esc(data.cacheDir || "")}</code>`;
  }

  grid.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const card = btn.closest(".card");
    const key = card && card.dataset.key;
    if (!key) return;
    const act = btn.dataset.act;

    if (act === "play") {
      location.href = `/play/${encodeURIComponent(key)}`;
      return;
    }

    if (act === "del") {
      const name = card.querySelector(".card-name").textContent;
      if (!confirm(`删除「${name}」的全部本地分片？\n\n这个操作不可恢复，原站视频不受影响。`)) return;
      btn.disabled = true;
      btn.textContent = "删除中";
      try {
        const r = await fetch(`/api/library/${encodeURIComponent(key)}`, { method: "DELETE" });
        const res = await r.json();
        if (!res.deleted) throw new Error("delete failed");
        card.remove();
        const left = grid.querySelectorAll(".card").length;
        if (!left) load();
        else btn.textContent = "已删除";
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "删除失败";
        setTimeout(() => { btn.textContent = "删除"; }, 1600);
      }
    }
  });

  // ---- 清理规则 -----------------------------------------------------------
  const sweepBar = document.getElementById("sweep-bar");
  const btnSweep = document.getElementById("btn-sweep");

  async function loadMaintenance() {
    let d;
    try {
      const r = await fetch("/api/maintenance", { cache: "no-store" });
      d = await r.json();
    } catch (_) {
      sweepBar.textContent = "读取清理规则失败：本地服务没有响应。";
      return;
    }
    const rl = d.rules || {};
    const age = rl.maxAgeDays > 0 ? `保留 <b>${rl.maxAgeDays}</b> 天` : "不限天数";
    const cap = rl.maxGB > 0 ? `上限 <b>${rl.maxGB} GB</b>` : "不限容量";
    const usage = d.limitGB > 0
      ? `当前 <b>${d.totalGB} GB</b> / ${d.limitGB} GB（${d.usagePct}%）`
      : `当前 <b>${d.totalGB} GB</b>`;
    const hot = d.limitGB > 0 && d.usagePct >= 90 ? " hot" : "";
    const every = d.enabled
      ? `每 <b>${rl.intervalMin}</b> 分钟自动巡检`
      : '<span class="hot">自动清理已关闭</span>';
    const last = d.lastRunAt
      ? `上次清理 ${new Date(d.lastRunAt).toLocaleString("zh-CN", { hour12: false })}`
      : "还没跑过清理";
    sweepBar.innerHTML = `<span>${age} · ${cap} · <span class="${hot.trim()}">${usage}</span></span>`
      + `<span>${every}</span><span>${last}</span>`;
  }

  btnSweep.addEventListener("click", async () => {
    btnSweep.disabled = true;
    btnSweep.textContent = "清理中…";
    try {
      const r = await fetch("/api/maintenance/sweep", { method: "POST" });
      const d = await r.json();
      const n = (d.removed || []).length;
      const failed = (d.failed || []).length;
      let msg = n
        ? `清理完成：删除 ${n} 个视频，释放 ${d.freedGB} GB`
        : "清理完成：没有需要删除的内容";
      if (failed) msg += `（${failed} 个删除失败）`;
      sweepBar.innerHTML = `<span>${esc(msg)}</span>`;
      await load();
      await loadMaintenance();
    } catch (err) {
      sweepBar.textContent = "清理失败：本地服务没有响应。";
    } finally {
      btnSweep.disabled = false;
      btnSweep.textContent = "立即清理";
    }
  });

  btnRefresh.addEventListener("click", () => { load(); loadMaintenance(); });
  load();
  loadMaintenance();
})();
</script>
</body>
</html>
